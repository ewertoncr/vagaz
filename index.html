<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vagaz</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Public+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#F5F4FB;--sf:#fff;--ink:#1B1640;--mut:#625E80;--ln:#E3E0F2;--pr:#5B45F5;--on:#fff;--ok:#12805A;--wr:#A15C00;--sp:#1B1640;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#110E26;--sf:#1B1740;--ink:#EEEBFF;--mut:#A9A4CC;--ln:#2D2859;--pr:#8E7DFF;--on:#14102E;--ok:#4CC38A;--wr:#E8AE55;--sp:#0C0A1C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#110E26;--sf:#1B1740;--ink:#EEEBFF;--mut:#A9A4CC;--ln:#2D2859;--pr:#8E7DFF;--on:#14102E;--ok:#4CC38A;--wr:#E8AE55;--sp:#0C0A1C;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Public Sans",system-ui,sans-serif}
h1,h2,h3,.logo{font-family:"Bricolage Grotesque","Public Sans",system-ui,sans-serif;margin:0;line-height:1.15}
main{max-width:480px;margin:0 auto;padding:16px 16px 104px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.logo{font-weight:800;font-size:26px;color:var(--pr);letter-spacing:-.5px}
.av{width:38px;height:38px;border-radius:50%;background:var(--pr);color:var(--on);display:grid;place-items:center;font-weight:600}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px;margin:0 0 10px}
.row{display:flex;gap:12px;align-items:center}.grow{flex:1;min-width:0}
.job{cursor:pointer}.job h3{font-size:17px}
.mut{color:var(--mut);font-size:14px}
.sq{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:#fff;font-family:"Bricolage Grotesque",system-ui,sans-serif;flex:none}
.hero{background:var(--sp);color:#fff;border-radius:22px;padding:20px;margin-bottom:14px}
.hero .mut{color:#C9C3F5}.hero h2{font-size:22px;margin:4px 0}
.stats{display:flex;gap:10px;margin-bottom:16px}.stats div{flex:1;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px}
.stats b{display:block;font:800 24px "Bricolage Grotesque",system-ui,sans-serif}
.tag{display:inline-block;border:1px solid var(--ln);border-radius:8px;padding:2px 8px;margin:2px 4px 2px 0;font-size:13px}
.tag.y{border-color:var(--ok);color:var(--ok)}.tag.n{border-color:var(--wr);color:var(--wr)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:10px 0 14px;padding-bottom:2px}
.chip{width:auto;margin:0;white-space:nowrap;background:var(--sf);color:var(--ink);border:1px solid var(--ln);padding:8px 14px;border-radius:999px;font-weight:500}
.chip.on{background:var(--pr);color:var(--on);border-color:var(--pr)}
button{font:inherit;font-weight:600;border:0;border-radius:14px;padding:15px;background:var(--pr);color:var(--on);width:100%;cursor:pointer;margin-top:8px}
button.sec{background:transparent;color:var(--pr);border:1.5px solid var(--pr)}
.back{width:auto;background:none;color:var(--pr);padding:4px 0;margin:0 0 10px}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 4px}
input,textarea,select{font:inherit;width:100%;padding:13px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);color:var(--ink)}
textarea{min-height:160px;resize:vertical}
button:focus-visible,input:focus-visible,textarea:focus-visible,.job:focus-visible{outline:3px solid var(--pr);outline-offset:2px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{margin:0;border-radius:0;background:none;color:var(--mut);padding:10px 4px 8px;font-size:12px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.on{color:var(--pr)}nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.badge{font-size:12px;font-weight:600;border-radius:8px;padding:3px 8px}
.b1{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}.b2{background:color-mix(in srgb,var(--wr) 16%,transparent);color:var(--wr)}
.box{border:1.5px solid var(--ok);border-radius:14px;padding:12px;margin-top:10px}
.bar{height:8px;border-radius:8px;background:var(--ln);overflow:hidden;margin:6px 0 2px}.bar i{display:block;height:100%;background:var(--pr)}
.splash{position:fixed;inset:0;background:#1B1640;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:32px 24px calc(32px + env(safe-area-inset-bottom,0px))}
.splash .logo{font-size:64px;color:#fff}.splash p{color:#C9C3F5;font-size:18px;margin:8px 0 28px}
.splash button{background:#fff;color:#1B1640}
.toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;text-align:center;z-index:5}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function res(){var o=null,fc=norm(S.fc),fe=norm(S.fe);J.forEach(function(j){if(!o&&fc&&norm(j.l)===fc&&G[j.id].la)o=G[j.id]});return sorted().filter(function(j){var g=G[j.id];j._d=null;if(S.fm!=="Todas"&&j.m!==S.fm)return false;if(j.m==="Remoto")return true;if(fe&&norm(g.e).indexOf(fe)<0)return false;if(fc){if(o&&S.fr>0){j._d=Math.round(dist(o,g));return j._d<=S.fr}if(norm(j.l)!==fc)return false;j._d=0}return true})}
function card(j){var g=G[j.id],d=j._d;return '<div class="card job row" tabindex="0" role="button" onclick="openJob('+j.id+')" onkeydown="if(event.key===\'Enter\')openJob('+j.id+')">'+sq(j)+'<div class="grow"><h3>'+esc(j.t)+'</h3><div class="mut">'+esc(j.c)+'</div><div class="mut">'+(j.m==="Remoto"?"Remoto":esc(j.l)+(d>0?", a "+d+" km":""))+'</div><div class="mut">via '+g.s+'</div></div><div style="color:var(--pr)">'+ring(mt(j),56)+'</div></div>'}
function doSearch(){S.busy=true;render();setTimeout(function(){S.busy=false;S.res=true;render()},1400)}
function setM(m){S.fm=m;render()}
function openSrc(id){var j=J.filter(function(x){return x.id===id})[0],s=G[id].s,q=encodeURIComponent(j.t+" "+j.c),u=s==="LinkedIn"?"https://www.linkedin.com/jobs/search/?keywords="+q:s==="Indeed"?"https://www.indeed.com/jobs?q="+q:"https://www.google.com/search?q="+q+"+"+s;try{window.open(u,"_blank")}catch(e){}}
var _R=render;render=function(){_R();if(S.tab!=="vagas")return;var a=$("app"),top='<div class="top"><span class="logo">vagaz</span><span class="av">'+esc((P.nome||"V")[0].toUpperCase())+'</span></div>';
if(S.busy){a.innerHTML=top+'<h2>Buscando vagas</h2><p class="mut">Consultando LinkedIn, Indeed, Randstad, OLX e outras fontes. Isso leva alguns segundos.</p><div class="bar"><i style="width:70%"></i></div>';return}
if(S.res){var L=res(),fs={};L.forEach(function(j){fs[G[j.id].s]=1});a.innerHTML=top+'<h2>'+L.length+' vagas encontradas</h2><p class="mut">'+Object.keys(fs).length+' fontes'+(S.fc?', perto de '+esc(S.fc)+(S.fr>0?', raio de '+S.fr+' km':''):'')+(S.fe?', em '+esc(S.fe):'')+'</p><button class="sec" onclick="S.res=false;render()">Alterar filtros</button><div style="height:12px"></div>'+(L.length?L.map(card).join(""):'<p class="mut">Nenhuma vaga nesse raio. Aumente o raio ou mude os filtros.</p>');return}
var cs={};J.forEach(function(j){if(G[j.id].la)cs[j.l]=1});
a.innerHTML=top+'<h2>Buscar vagas</h2><p class="mut">Escolha onde você quer trabalhar. Não precisa digitar o nome da vaga.</p><label for="g1">Cidade</label><input id="g1" list="cid" value="'+esc(S.fc)+'" placeholder="Ex.: Lisboa" oninput="S.fc=this.value"><datalist id="cid">'+Object.keys(cs).map(function(c){return '<option value="'+esc(c)+'">'}).join("")+'</datalist><label for="g2">Estado ou distrito</label><input id="g2" value="'+esc(S.fe)+'" placeholder="Ex.: SP ou Porto" oninput="S.fe=this.value"><label for="g3">Raio a partir da cidade</label><select id="g3" onchange="S.fr=+this.value">'+[[0,"Só esta cidade"],[10,"10 km"],[25,"25 km"],[50,"50 km"],[100,"100 km"],[200,"200 km"]].map(function(o){return '<option value="'+o[0]+'"'+(S.fr===o[0]?' selected':'')+'>'+o[1]+'</option>'}).join("")+'</select><label>Modalidade</label><div class="chips">'+["Todas","Presencial","Híbrido","Remoto"].map(function(m){return '<button class="chip '+(S.fm===m?"on":"")+'" onclick="setM(\''+m+'\')">'+m+'</button>'}).join("")+'</div><button onclick="doSearch()">Buscar vagas</button><p class="mut">Pesquisa em LinkedIn, Indeed, Randstad, OLX e outras fontes ao mesmo tempo.</p>'};
render();
</script>
